# Render Blueprint for the Rondo backend only. The frontend deploys to
# Vercel separately (see docs/BETA_DEPLOYMENT.md) — do not add a static
# site here.
#
# Render Free does not reliably expose a scriptable "Pre-Deploy Command"
# across every plan/Blueprint schema version, so migrations are not left as
# a manual dashboard step: buildCommand runs `pnpm --filter @rondo/backend
# predeploy` (prisma generate + prisma migrate deploy — never `migrate dev`,
# never a reset) before compiling. Render exposes the service's env vars
# during the build step too, so DATABASE_URL is available for migrate
# deploy at build time. If a migration fails, the build fails and the
# previous deploy keeps serving traffic.
#
# --prod=false is required: NODE_ENV=production (set below) is present
# during the build too, and pnpm treats that as an implicit --prod, which
# skips devDependencies workspace-wide — including @types/node, typescript
# and vitest, all needed to compile the backend. Without it the build fails
# with TS2688 ("Cannot find type definition file for 'node'"/'vitest/globals').
services:
  - type: web
    name: rondo-backend
    env: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm --filter @rondo/backend predeploy && pnpm build:backend
    startCommand: pnpm --filter @rondo/backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # PORT is intentionally not set here — Render injects its own PORT at
      # runtime, and apps/backend/src/main.ts reads process.env.PORT.
      - key: HOST
        value: 0.0.0.0
      # Set these to real values in the Render dashboard — never commit them.
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_CLERK_USER_ID
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
